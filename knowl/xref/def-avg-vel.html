<div class="para logical">
<div class="para">The average velocity over a period of time <span class="process-math">\(\Delta t\)</span> is the change in position divided by the change in time for that interval.</div>
<div class="displaymath process-math">
\begin{equation*}
\vec{v}_{avg} = \frac{\Delta \vec{r}}{\Delta t} = \frac{\vec{r}_{f} - \vec{r}_{i}}{t_{f} - t_{i}}
\end{equation*}
</div>
